name: Build Air96 V2 GSE Toggle v2

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - air96v2-gse-build

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable safe.directory check
        run: git config --global --add safe.directory '*'

      - name: Checkout NuPhy QMK
        uses: actions/checkout@v4
        with:
          repository: nuphy-src/qmk_firmware
          ref: nuphy-keyboards
          path: qmk

      - name: Deploy QMK submodules
        working-directory: qmk
        run: qmk git-submodule -f

      - name: Patch Air96 V2 ANSI
        run: echo '' | base64 -d | python3

      - name: Compile firmware
        working-directory: qmk
        run: qmk compile -kb nuphy/air96_v2/ansi -km via

      - name: Collect firmware
        run: |
          set -eux
          FW=$(find qmk -maxdepth 1 -type f -name '*air96*v2*via*.bin' | head -n 1)
          test -n "$FW"
          cp "$FW" Air96V2_GSE_Toggle_170ms.bin
          sha256sum Air96V2_GSE_Toggle_170ms.bin > Air96V2_GSE_Toggle_170ms.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Air96V2-GSE-Toggle-170ms
          path: |
            Air96V2_GSE_Toggle_170ms.bin
            Air96V2_GSE_Toggle_170ms.sha256
