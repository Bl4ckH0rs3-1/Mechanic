name: Build Air96 V2 VIA Toggle Macros

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - air96v2-gse-build

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable safe.directory check
        run: git config --global --add safe.directory '*'

      - name: Checkout NuPhy QMK
        uses: actions/checkout@v4
        with:
          repository: nuphy-src/qmk_firmware
          ref: nuphy-keyboards
          path: qmk

      - name: Checkout concurrent macro engine
        uses: actions/checkout@v4
        with:
          repository: yeroca/qmk_concurrent_macros
          ref: effb84dee36dfc8935546de822eaa3b1da90bf79
          path: cm

      - name: Install NuPhy QMK Python requirements
        run: /opt/uv/tools/qmk/bin/python3 -m pip install --disable-pip-version-check -r qmk/requirements.txt

      - name: Deploy QMK submodules
        working-directory: qmk
        run: qmk git-submodule -f

      - name: Integrate VIA toggle macro engine into Air96 V2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          qmk = Path('qmk')
          via_dir = qmk / 'keyboards/nuphy/air96_v2/ansi/keymaps/via'
          src_c = Path('cm/concurrent_macros/concurrent_macros.c').read_text(encoding='utf-8')
          src_h = Path('cm/concurrent_macros/concurrent_macros.h').read_text(encoding='utf-8')

          # NuPhy's branch predates the C fixed-underlying-enum syntax used by the module.
          src_c = src_c.replace(
              'typedef enum : uint8_t { CM_FREE, CM_IDLE, CM_DO_NEXT, CM_ERROR } concurrent_macros_state_t;',
              'typedef enum { CM_FREE, CM_IDLE, CM_DO_NEXT, CM_ERROR } concurrent_macros_state_t;'
          )
          src_h = src_h.replace(
              'typedef enum : uint8_t { MACRO_LED_STATE_IDLE, MACRO_LED_STATE_RUNNING, MACRO_LED_STATE_STOPPING, MACRO_LED_STATE_ERROR } concurrent_macros_led_state_t;',
              'typedef enum { MACRO_LED_STATE_IDLE, MACRO_LED_STATE_RUNNING, MACRO_LED_STATE_STOPPING, MACRO_LED_STATE_ERROR } concurrent_macros_led_state_t;'
          )

          (via_dir / 'concurrent_macros.c').write_text(src_c, encoding='utf-8')
          (via_dir / 'concurrent_macros.h').write_text(src_h, encoding='utf-8')

          rules = (via_dir / 'rules.mk').read_text(encoding='utf-8')
          if 'DEFERRED_EXEC_ENABLE' not in rules:
              rules += '\nDEFERRED_EXEC_ENABLE = yes\n'
          if 'concurrent_macros.c' not in rules:
              rules += 'SRC += concurrent_macros.c\n'
          (via_dir / 'rules.mk').write_text(rules, encoding='utf-8')

          # The old NuPhy VIA core consumes QK_MACRO before process_record_user().
          # Route VIA macro keycodes into the concurrent engine instead.
          via_c = qmk / 'quantum/via.c'
          v = via_c.read_text(encoding='utf-8')
          old = '''bool process_record_via(uint16_t keycode, keyrecord_t *record) {
    // Handle macros
    if (record->event.pressed) {
        if (keycode >= QK_MACRO && keycode <= QK_MACRO_MAX) {
            uint8_t id = keycode - QK_MACRO;
            dynamic_keymap_macro_send(id);
            return false;
        }
    }

    return true;
}'''
          new = '''extern bool process_record_concurrent_macros(uint16_t keycode, keyrecord_t *record);

bool process_record_via(uint16_t keycode, keyrecord_t *record) {
    return process_record_concurrent_macros(keycode, record);
}'''
          if old not in v:
              raise SystemExit('NuPhy via.c macro handler pattern not found')
          via_c.write_text(v.replace(old, new, 1), encoding='utf-8')

          # Drive the module's private deferred-exec table from QMK housekeeping.
          keymap_c = via_dir / 'keymap.c'
          k = keymap_c.read_text(encoding='utf-8')
          marker = '#include QMK_KEYBOARD_H\n'
          hook = '''#include "concurrent_macros.h"\n\nvoid housekeeping_task_concurrent_macros(void);\n\nvoid housekeeping_task_user(void) {\n    housekeeping_task_concurrent_macros();\n}\n\n'''
          if marker not in k:
              raise SystemExit('Air96 V2 VIA keymap include marker not found')
          if 'housekeeping_task_user(' in k:
              raise SystemExit('Air96 V2 VIA keymap already defines housekeeping_task_user')
          keymap_c.write_text(k.replace(marker, marker + hook, 1), encoding='utf-8')
          PY

      - name: Compile firmware
        working-directory: qmk
        run: qmk compile -kb nuphy/air96_v2/ansi -km via

      - name: Collect firmware
        run: |
          set -eux
          find qmk -maxdepth 1 -type f \( -name '*.bin' -o -name '*.hex' -o -name '*.uf2' \) -print
          FW=$(find qmk -maxdepth 1 -type f -name '*air96*v2*via*.bin' | head -n 1)
          test -n "$FW"
          cp "$FW" Air96V2_VIA_ToggleMacros.bin
          sha256sum Air96V2_VIA_ToggleMacros.bin > Air96V2_VIA_ToggleMacros.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Air96V2-VIA-ToggleMacros
          path: |
            Air96V2_VIA_ToggleMacros.bin
            Air96V2_VIA_ToggleMacros.sha256
