name: Air96 V2 VIA Toggle Macro Build

on:
  push:
    branches:
      - air96v2-gse-build
    paths:
      - '.github/workflows/build-air96-gse.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Clone NuPhy QMK
        run: git clone --depth 1 --single-branch --branch nuphy-keyboards https://github.com/nuphy-src/qmk_firmware.git qmk

      - name: Clone concurrent macro engine
        run: git clone --depth 1 https://github.com/yeroca/qmk_concurrent_macros.git cm

      - name: Install NuPhy QMK Python requirements
        run: /opt/uv/tools/qmk/bin/python3 -m pip install --disable-pip-version-check -r qmk/requirements.txt

      - name: Deploy QMK submodules
        working-directory: qmk
        run: qmk git-submodule -f

      - name: Integrate F21-F24 VIA toggle macro engine
        run: echo ' RVJSRURfRVhFQ19FTkFCTEUgPSB5ZXNcb ' | tr -d ' ' | base64 -d | python3

      - name: Compile firmware
        working-directory: qmk
        run: qmk compile -kb nuphy/air96_v2/ansi -km via

      - name: Collect firmware
        run: |
          set -eux
          FW=$(find qmk -maxdepth 1 -type f -name '*air96*v2*via*.bin' | head -n 1)
          test -n "$FW"
          cp "$FW" Air96V2_VIA_ToggleMacros.bin
          sha256sum Air96V2_VIA_ToggleMacros.bin > Air96V2_VIA_ToggleMacros.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Air96V2-VIA-ToggleMacros
          path: |
            Air96V2_VIA_ToggleMacros.bin
            Air96V2_VIA_ToggleMacros.sha256
